name: billetera-local

x-postgres: &postgres
  image: postgres:17.12-bookworm
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
    interval: 5s
    timeout: 4s
    start_period: 15s
    retries: 12

services:
  postgres-usuarios:
    <<: *postgres
    environment:
      POSTGRES_DB: billetera_usuarios
      POSTGRES_USER: ${POSTGRES_USUARIOS_USER:?define POSTGRES_USUARIOS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USUARIOS_PASSWORD:?define POSTGRES_USUARIOS_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    networks: [usuarios-db]
    volumes:
      - postgres-usuarios:/var/lib/postgresql/data

  postgres-transacciones:
    <<: *postgres
    environment:
      POSTGRES_DB: billetera_transacciones
      POSTGRES_USER: ${POSTGRES_TRANSACCIONES_USER:?define POSTGRES_TRANSACCIONES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TRANSACCIONES_PASSWORD:?define POSTGRES_TRANSACCIONES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    networks: [transacciones-db]
    volumes:
      - postgres-transacciones:/var/lib/postgresql/data

  postgres-notificaciones:
    <<: *postgres
    environment:
      POSTGRES_DB: billetera_notificaciones
      POSTGRES_USER: ${POSTGRES_NOTIFICACIONES_USER:?define POSTGRES_NOTIFICACIONES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICACIONES_PASSWORD:?define POSTGRES_NOTIFICACIONES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    networks: [notificaciones-db]
    volumes:
      - postgres-notificaciones:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: cLdM0nGvR8Ks7kPdj4sJrg
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    networks: [eventos]
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, 'KAFKA_HEAP_OPTS="-Xms64m -Xmx128m" /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list']
      interval: 10s
      timeout: 8s
      start_period: 30s
      retries: 12

  frontend:
    profiles: [frontend]
    image: billetera-frontend:0.1.0-local
    build:
      context: ./frontend
      args:
        VITE_DATA_MODE: ${VITE_DATA_MODE:-demo}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:8080'
    networks: [web]
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  usuarios-db:
    internal: true
  transacciones-db:
    internal: true
  notificaciones-db:
    internal: true
  eventos:
    internal: true
  web:

volumes:
  postgres-usuarios:
  postgres-transacciones:
  postgres-notificaciones:
  kafka:
