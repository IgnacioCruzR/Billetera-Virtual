name: CI de ms-usuarios

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...
      - name: Exigir 60 por ciento de cobertura de sentencias
        run: |
          go tool cover -func=coverage.out
          awk '
            NR > 1 && NF == 3 {
              statements[$1] = $2
              if ($3 > 0) executed[$1] = 1
            }
            END {
              for (block in statements) {
                total += statements[block]
                if (executed[block]) covered += statements[block]
              }
              exit !(total > 0 && covered * 100 >= total * 60)
            }' coverage.out
      - name: Construir imagen del servicio
        run: docker build --tag billetera-usuarios:ci .
