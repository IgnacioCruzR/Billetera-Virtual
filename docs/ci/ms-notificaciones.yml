name: CI de ms-notificaciones

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode checkstyle:check
      - run: mvn --batch-mode verify
      - name: Exigir 60 por ciento de cobertura de líneas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("target/site/jacoco/jacoco.xml")
          if not report.is_file():
              raise SystemExit("Se requiere el reporte JaCoCo generado por Maven verify.")
          counter = ElementTree.parse(report).getroot().find("counter[@type='LINE']")
          if counter is None:
              raise SystemExit("El reporte no contiene cobertura de líneas.")
          covered = int(counter.attrib["covered"])
          total = int(counter.attrib["missed"]) + covered
          if total == 0:
              raise SystemExit("El reporte no contiene líneas de aplicación medibles.")
          print(f"Cobertura de líneas: {covered / total:.2%}")
          if covered * 100 < total * 60:
              raise SystemExit("La cobertura de líneas es inferior al 60 %.")
          PY
      - name: Construir imagen del servicio
        run: docker build --tag billetera-notificaciones:ci .
